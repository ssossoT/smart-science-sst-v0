<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="중학교 방과후학교 스마트과학반 운영 관리 시스템">
<meta name="robots" content="noindex">
<title>스마트과학반 LAB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230e7490'/><text x='16' y='22' font-size='15' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'>SL</text></svg>">
<link rel="stylesheet" href="./css/common.css">
</head>
<body>

<div class="landing">

  <header class="landing-nav">
    <span class="brand">
      <span class="brand-mark" data-brand-mark>SL</span>
      <span data-site-name>스마트과학반 LAB</span>
    </span>
    <a class="teacher-entry" href="./teacher.html">
      교사용 로그인 <span aria-hidden="true">→</span>
    </a>
  </header>

  <main class="landing-hero">

    <div class="hero-deco hero-deco-1" aria-hidden="true" style="color:var(--accent)">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M40 12h20"/>
        <path d="M44 12v22L24 78a8 8 0 0 0 7 12h38a8 8 0 0 0 7-12L56 34V12"/>
        <path d="M32 66h36"/>
        <circle cx="49" cy="49" r="2.6" fill="currentColor" stroke="none"/>
        <circle cx="58" cy="58" r="2" fill="currentColor" stroke="none"/>
        <circle cx="43" cy="58" r="1.6" fill="currentColor" stroke="none"/>
      </svg>
    </div>

    <div class="hero-deco hero-deco-2" aria-hidden="true" style="color:#e08a45">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round">
        <ellipse cx="50" cy="50" rx="42" ry="16"/>
        <ellipse cx="50" cy="50" rx="42" ry="16" transform="rotate(60 50 50)"/>
        <ellipse cx="50" cy="50" rx="42" ry="16" transform="rotate(120 50 50)"/>
        <circle cx="50" cy="50" r="6" fill="currentColor" stroke="none"/>
      </svg>
    </div>

    <div class="hero-deco hero-deco-3" aria-hidden="true" style="color:var(--accent)">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M50 14 L58 42 L86 50 L58 58 L50 86 L42 58 L14 50 L42 42 Z"/>
      </svg>
    </div>

    <p class="hero-eyebrow">🔬 방과후 과학 실험실</p>

    <h1 class="hero-title" id="intro-text">실험으로 과학을 직접 확인하는 중학교 방과후 활동입니다.</h1>

    <div class="hero-actions">
      <a class="btn btn-primary btn-lg" href="./student.html">학생 화면 열기 <span aria-hidden="true">→</span></a>
      <a class="btn btn-lg btn-outline" href="#info">운영 안내 보기</a>
    </div>

    <section class="hero-stats" id="info" aria-label="운영 안내">
      <div class="stat">
        <div class="k">운영 학년도</div>
        <div class="v" id="info-year">—</div>
      </div>
      <div class="stat">
        <div class="k">운영 기간</div>
        <div class="v" id="info-period" style="font-size:15px">—</div>
      </div>
      <div class="stat">
        <div class="k">다음 일정</div>
        <div class="v" id="info-next" style="font-size:15px">—</div>
        <div class="s" id="info-next-sub"></div>
      </div>
    </section>

  </main>

  <footer class="site-footer" id="footer"></footer>
</div>

<script type="module">
import { loadSettings, listPublicSessions, DEFAULT_SETTINGS } from './js/firebase-service.js';
import { applyBranding, studentFooterHtml } from './js/common.js';
import { fmtDate, relativeDay, esc } from './js/ui.js';

const footer = document.getElementById('footer');

function render(settings, nextSession) {
  applyBranding(settings);

  document.getElementById('intro-text').textContent =
    settings.intro || DEFAULT_SETTINGS.intro;

  document.getElementById('info-year').textContent =
    settings.year ? `${settings.year}학년도` : '—';

  const start = settings.periodStart ? fmtDate(settings.periodStart, { withWeek: false }) : '';
  const end = settings.periodEnd ? fmtDate(settings.periodEnd, { withWeek: false }) : '';
  document.getElementById('info-period').textContent =
    start && end ? `${start} ~ ${end}` : '—';

  const nextEl = document.getElementById('info-next');
  const subEl = document.getElementById('info-next-sub');
  if (nextSession?.date) {
    nextEl.textContent = fmtDate(nextSession.date);
    subEl.textContent = [relativeDay(nextSession.date), nextSession.periodLabel].filter(Boolean).join(' · ');
  } else {
    nextEl.textContent = '—';
    subEl.textContent = '';
  }

  footer.innerHTML = studentFooterHtml(settings);
}

async function boot() {
  // 첫 화면은 로그인 없이 열리므로, 이 브라우저에 저장된 운영 정보만 읽는다.
  const settings = await loadSettings();
  let next = null;
  try {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const sessions = await listPublicSessions(settings.year);
    next = sessions
      .filter(s => !s.noClass && s.date && new Date(`${s.date}T00:00:00`) >= today)
      .sort((a, b) => a.date.localeCompare(b.date))[0] || null;
  } catch (e) {
    console.warn('[landing] 안내 정보를 불러오지 못했습니다.', e);
  }
  render(settings, next);
}

boot();
</script>
</body>
</html>
