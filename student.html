<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>학생용 · 스마트과학반 LAB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233b6df6'/><text x='16' y='22' font-size='15' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'>SL</text></svg>">
<link rel="stylesheet" href="./css/common.css">
<link rel="stylesheet" href="./css/student.css">
</head>
<body>

<!-- ── 로그인 ──────────────────────────────────────────────────────── -->
<div class="auth-shell" id="login-screen" hidden>
  <div class="auth-card">
    <span class="brand" style="margin-bottom:14px">
      <span class="brand-mark" data-brand-mark>🧪</span>
      <span data-site-name>스마트과학반 LAB</span>
    </span>
    <h1>학생 로그인</h1>
    <p class="sub">이름과 비밀번호를 입력해 주세요.</p>

    <form class="auth-form" id="login-form" autocomplete="off">
      <div class="field">
        <label for="login-name">이름</label>
        <input class="input" id="login-name" name="loginName" type="text"
               autocomplete="username" inputmode="text" required maxlength="40" placeholder="홍길동">
      </div>
      <div class="field">
        <label for="login-pw">비밀번호</label>
        <input class="input" id="login-pw" name="password" type="password"
               autocomplete="current-password" required maxlength="72">
      </div>
      <div class="auth-error" id="login-error" hidden></div>
      <button class="btn btn-primary btn-lg btn-block" id="login-submit" type="submit">로그인</button>
    </form>

    <p class="auth-back">
      초기 계정: 홍길동 · 김철수 · 이영희 (비밀번호 0000)
    </p>
    <a class="auth-back" href="./index.html">← 처음 화면으로</a>
  </div>
</div>

<!-- ── 학생 앱 ─────────────────────────────────────────────────────── -->
<div class="s-app" id="app" hidden>
  <header class="s-top">
    <span class="brand">
      <span class="brand-mark" data-brand-mark>🧪</span>
      <span data-site-name>스마트과학반 LAB</span>
    </span>
    <div class="spacer"></div>
    <span class="me"><span class="nick" id="me-name"></span></span>
    <button class="btn logout-btn" id="logout-btn" type="button">로그아웃</button>
  </header>

  <nav class="s-nav" id="nav"></nav>

  <main class="s-view scroll-y" id="view"></main>
</div>

<div id="boot-screen" class="auth-shell">
  <div class="flex items-center gap-10 muted"><span class="spinner"></span> 불러오는 중…</div>
</div>

<script type="module" src="./js/student.js"></script>
</body>
</html>
