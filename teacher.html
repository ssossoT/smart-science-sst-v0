<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>선생님용 · 스마트과학반 LAB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230e7490'/><text x='16' y='22' font-size='15' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'>SL</text></svg>">
<link rel="stylesheet" href="./css/common.css">
<link rel="stylesheet" href="./css/teacher.css">
<link rel="stylesheet" href="./css/print.css">
</head>
<body>

<!-- ── 로그인 화면 ─────────────────────────────────────────────────── -->
<div class="auth-shell" id="login-screen" hidden>
  <div class="auth-card">
    <span class="brand" style="margin-bottom:14px">
      <span class="brand-mark" data-brand-mark>SL</span>
      <span data-site-name>스마트과학반 LAB</span>
    </span>
    <h1>선생님용 로그인</h1>
    <p class="sub">이름과 비밀번호를 입력해 주세요.</p>

    <form class="auth-form" id="login-form" autocomplete="off">
      <div class="field">
        <label for="login-name">이름</label>
        <input class="input" id="login-name" name="name" type="text"
               autocomplete="username" required maxlength="40" placeholder="성소연">
      </div>
      <div class="field">
        <label for="login-pw">비밀번호</label>
        <input class="input" id="login-pw" name="password" type="password"
               autocomplete="current-password" required maxlength="72">
      </div>
      <div class="auth-error" id="login-error" hidden></div>
      <button class="btn btn-primary btn-lg btn-block" id="login-submit" type="submit">로그인</button>
    </form>

    <p class="auth-back">
      데모 계정: 성소연 (비밀번호 0000)
    </p>
    <a class="auth-back" href="./index.html">← 처음 화면으로</a>
  </div>
</div>

<!-- ── 앱 셸 ───────────────────────────────────────────────────────── -->
<div class="app" id="app" hidden>

  <header class="topbar">
    <button class="btn btn-icon menu-toggle" id="menu-toggle" type="button" aria-label="메뉴 열기">☰</button>
    <span class="brand">
      <span class="brand-mark" data-brand-mark>SL</span>
      <span data-site-name>스마트과학반 LAB</span>
    </span>
    <span class="year-pill" id="top-year"></span>
    <div class="spacer"></div>
    <div class="who">
      <span class="avatar" id="top-avatar"></span>
      <span class="truncate" id="top-name"></span>
    </div>
    <button class="btn btn-sm" id="logout-btn" type="button">로그아웃</button>
  </header>

  <div class="app-body">
    <aside class="sidebar" id="sidebar">
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <a class="btn btn-sm btn-block" href="./student.html" target="_blank" rel="noopener">학생 화면 열기</a>
        <a class="btn btn-sm btn-block" href="./index.html">처음 화면</a>
      </div>
    </aside>

    <main class="main">
      <div class="view-head" id="view-head"></div>
      <div class="view" id="view"></div>
    </main>
  </div>
</div>

<div id="boot-screen" class="auth-shell">
  <div class="flex items-center gap-10 muted"><span class="spinner"></span> 불러오는 중…</div>
</div>

<script type="module" src="./js/teacher.js"></script>
</body>
</html>
